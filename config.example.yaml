app:
  name: "GoClaw"
  version: "0.1.0"
  port: 8080

log:
  level: "info"
  format: "text"

database:
  type: "sqlite"
  path: "goclaw.db"

ai:
  provider: "openai"  # or "qwen" for Alibaba Cloud Qwen
  model: "gpt-4o-mini"  # or "qwen-plus" for Qwen
  api_key: "your-api-key-here"
  api_base: ""  # Optional: custom API endpoint
  max_tokens: 1024
  temperature: 0.7

telegram:
  bot_token: "your-telegram-bot-token"
  webhook: ""

discord:
  bot_token: "your-discord-bot-token"
  guild_id: ""

tools:
  email:
    imap_server: "imap.gmail.com"
    username: "your-email@gmail.com"
    password: "your-app-password"
  calendar:
    provider: "google"
    api_key: "your-google-api-key"
